<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Roel Joshua Fontanilla | Virtual Assistant &amp; AI Content Specialist</title>
    <meta data-static-meta name="description" content="Virtual assistant and AI content specialist in the Philippines: reliable operations, organised workflows and high-volume AI video for growing brands." />
    <link rel="icon" href="/images/brand/jf-mark.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/bricolage-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/profile/josh.webp" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#080D14" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Josh Fontanilla" />
    <meta property="og:url" content="https://jayefontanilla-max.github.io/" />
    <meta property="og:title" content="Roel Joshua Fontanilla | Virtual Assistant &amp; AI Content Specialist" />
    <meta property="og:description" content="Virtual assistant and AI content specialist in the Philippines: reliable operations, organised workflows and high-volume AI video for growing brands." />
    <meta property="og:image" content="https://jayefontanilla-max.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roel Joshua Fontanilla, Virtual Assistant &amp; AI Content Specialist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jayefontanilla-max.github.io/og-image.png" />

    <!-- Dark by default; a saved light pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F5F2EA')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
